<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chat">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="../../manifest.json">
  <link rel="apple-touch-icon" href="../../icon-192.png">
  <title>Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/crypto-js.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="blur-overlay">
    <div id="chat-container">
      <div id="chat-header">
        <span id="chat-recipient-name"></span>
        <div id="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
        <button id="notif-toggle" class="icon-btn" title="Enable push notifications">
          <span class="material-symbols-outlined notif-off">notifications_off</span>
          <span class="material-symbols-outlined notif-on">notifications</span>
        </button>
        <button id="email-alert-btn" class="icon-btn" title="Set email alert">
          <span class="material-symbols-outlined">mail</span>
        </button>
      </div>
      <div id="chat-messages"></div>
      <div id="image-preview-bar"></div>
      <div class="input-container" id="input-container">
        <input type="text" class="username-input" id="username-input" placeholder="Your Name">
        <input type="text" class="recipient-input" id="recipient-input" placeholder="Recipient">
        <div id="message-row">
          <button id="emoji-btn" class="icon-btn" title="Emoji"><span class="material-symbols-outlined">mood</span></button>
          <button id="gif-btn" class="icon-btn" title="GIF"><span class="material-symbols-outlined">gif</span></button>
          <label for="image-input" id="image-upload-btn" class="icon-btn" title="Upload Image">
            <span class="material-symbols-outlined">image</span>
          </label>
          <input type="file" accept="image/*" id="image-input" style="display: none;">
          <input type="text" id="message-input" placeholder="Type your message...">
          <button id="send-btn" class="send-btn"><span class="material-symbols-outlined">send</span></button>
        </div>
      </div>
    </div>
    <div id="info-container">
      <label id="ephemeral-toggle">
        <input type="checkbox" id="ephemeral-checkbox"> Messages disappear on refresh
      </label>
      <hr>
      <h3>Formatting</h3>
      <p>You can use <a href="https://www.markdownguide.org/basic-syntax/" target="_blank">Markdown Basic Syntax</a>.</p>
    </div>
  </div>

  <!-- Emoji Picker -->
  <div id="emoji-picker" class="picker-panel hidden">
    <div id="emoji-search-bar">
      <input type="text" id="emoji-search" placeholder="Search emoji...">
    </div>
    <div id="emoji-grid"></div>
  </div>

  <!-- GIF Picker -->
  <div id="gif-picker" class="picker-panel hidden">
    <div id="gif-search-bar">
      <input type="text" id="gif-search" placeholder="Search GIFs...">
    </div>
    <div id="gif-grid"></div>
    <div id="gif-powered">Powered by GIPHY</div>
  </div>

  <!-- Image Preview Popup -->
  <div id="preview-popup" class="preview-popup">
    <img id="popup-image" />
    <div class="close-btn" id="close-preview-btn">
      <i class="material-icons">close</i>
    </div>
  </div>

  <!-- Upload Progress Overlay -->
  <div id="upload-overlay" class="hidden">
    <div id="upload-progress-container">
      <div id="upload-progress-bar"></div>
      <span id="upload-progress-text">Uploading...</span>
    </div>
  </div>

  <!-- Email Alert Modal -->
  <div id="email-modal-overlay" class="hidden">
    <div id="email-modal">
      <div id="email-modal-header">
        <span>Email Alerts</span>
        <button id="email-modal-close" class="icon-btn"><span class="material-symbols-outlined">close</span></button>
      </div>
      <p id="email-modal-desc">Enter an email address to get notified by email when you receive a new message after 10+ minutes of silence.</p>
      <input type="email" id="email-alert-input" placeholder="you@example.com" autocomplete="off">
      <div id="email-modal-actions">
        <button id="email-alert-save" class="email-modal-btn primary">Save</button>
        <button id="email-alert-clear" class="email-modal-btn">Remove</button>
      </div>
      <div id="email-saved-msg" class="hidden"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.2.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.2/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.2/firebase-storage.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.2/firebase-messaging.js"></script>
  <script src="https://chat.linosh.com/users/script.js"></script>
</body>
</html>
